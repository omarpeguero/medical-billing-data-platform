medical_billing:
  target: dev
  outputs:
    dev:
      type: sqlserver
      driver: 'ODBC Driver 18 for SQL Server'
      server: "{{ env_var('SQLSERVER_HOST') }}"
      port: "{{ env_var('SQLSERVER_PORT') | int }}"
      database: "{{ env_var('SQLSERVER_DATABASE') }}"
      schema: staging
      user: "{{ env_var('SQLSERVER_USER') }}"
      password: "{{ env_var('SQLSERVER_PASSWORD') }}"
      encrypt: true
      trust_cert: true
      threads: 2
