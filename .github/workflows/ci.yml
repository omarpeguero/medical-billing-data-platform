name: Medical Billing CI

on:
  pull_request:
    branches:
      - main

jobs:
  python-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate python syntax
        run: |
          python -m compileall -q medical_billing_simulator.py
          python -m compileall -q medical_billing_airflow/dags



  dbt-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install dbt
        run: pip install dbt-sqlserver==1.12.1

      - name: Verify dbt installation
        run: dbt --version

      - name: Validate dbt project
        working-directory: medical_billing_dbt
        env:
          SQLSERVER_HOST: localhost
          SQLSERVER_PORT: "1433"
          SQLSERVER_DATABASE: MedicalBilling_DW
          SQLSERVER_USER: ci_user
          SQLSERVER_PASSWORD: ci_placeholder_password
        run: dbt parse --target dev --profiles-dir config




  python-linting:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: pip install ruff==0.17.6

      - name: Check Python code quality
        run: |
          ruff check medical_billing_simulator.py medical_billing_airflow/dags/



  sql-linting:
    runs-on: ubuntu-latest

    steps:
      - name: Cheout repository
        uses: actions/checout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SQLFluff
        run: pip install sqlfluff==4.5.0

      - name: Check dbt SQL quality
        working-directory: medical_billing_dbt
        run: sqlfluff lint models/ --templater jinja