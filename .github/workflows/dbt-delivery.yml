name: dbt Container Delivery

on:
  push:
    branches:
      - main
    paths:
      - "medical_billing_dbt/**"
      - ".github/workflows/dbt-delivery.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish-dbt-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish dbt image
        uses: docker/build-push-action@v6
        with:
          context: ./medical_billing_dbt
          file: ./medical_billing_dbt/Dockerfile.airflow-runner
          push: true
          tags: ghcr.io/omarpeguero/medical-billing-dbt:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/omarpeguero/medical-billing-data-platform
            org.opencontainers.image.revision=${{ github.sha }}
