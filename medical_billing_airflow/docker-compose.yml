name: medical-billing-airflow
services:
  airflow:
    build: .
    image: medical-billing-airflow:latest
    container_name: medical_billing_airflow
    restart: unless-stopped
    command: standalone
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
      AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
      DBT_IMAGE: ${DBT_IMAGE:?DBT_IMAGE must be configured}
    volumes:
      - airflow_data:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
      - ../medical_billing_dbt/.env:/opt/airflow/secrets/dbt.env:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
volumes:
  airflow_data:
